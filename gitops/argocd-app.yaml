apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ultron-store-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Shaun-Trigga96/ULTRON-STORE.git'
    path: gitops/manifests
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ultron-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
