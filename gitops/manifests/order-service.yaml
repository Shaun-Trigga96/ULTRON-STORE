apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: ultron/order-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4003
        env:
        - name: PORT
          value: "4003"
        - name: DB_HOST
          value: "postgres"
        - name: DB_NAME
          value: "ultrondb"
        - name: DB_USER
          value: "appuser"
        - name: DB_PASSWORD
          value: "devsecret"
        - name: INVENTORY_URL
          value: "http://inventory-service:4001"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  ports:
  - port: 4003
  selector:
    app: order-service
