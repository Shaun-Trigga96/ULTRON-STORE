apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        include       mime.types;
        default_type  application/json;
        sendfile        on;
        keepalive_timeout 65;

        upstream inventory_backend {
            server inventory-service:4001;
        }
        upstream catalog_backend {
            server catalog-service:4002;
        }
        upstream order_backend {
            server order-service:4003;
        }
        upstream payment_backend {
            server payment-service:4004;
        }
        upstream frontend_store {
            server frontend-store:3001;
        }

        server {
            listen 80;
            server_name localhost;

            gzip on;
            gzip_types text/plain application/json application/javascript text/css;

            location /health {
                return 200 '{"status":"UP","gateway":"ULTRON API Gateway Nginx","version":"1.0.0"}';
                add_header Content-Type application/json;
            }

            location /api/v1/inventory/ {
                proxy_pass http://inventory_backend;
            }
            location /api/v1/catalog/ {
                proxy_pass http://catalog_backend;
            }
            location /api/v1/orders/ {
                proxy_pass http://order_backend;
            }
            location /api/v1/payments/ {
                proxy_pass http://payment_backend;
                proxy_set_header Idempotency-Key $http_idempotency_key;
            }
            location / {
                proxy_pass http://frontend_store;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config-volume
        configMap:
          name: nginx-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: api-gateway
