apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: ultron/payment-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4004
        env:
        - name: PORT
          value: "4004"
        - name: DB_HOST
          value: "postgres"
        - name: DB_NAME
          value: "ultrondb"
        - name: DB_USER
          value: "appuser"
        - name: DB_PASSWORD
          value: "devsecret"
        - name: STRIPE_SECRET_KEY
          value: "sk_test_mock_dummy"
        - name: WEBHOOK_SECRET
          value: "whsec_mock_dummy"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  ports:
  - port: 4004
  selector:
    app: payment-service
