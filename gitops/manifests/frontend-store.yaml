apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-store
  template:
    metadata:
      labels:
        app: frontend-store
    spec:
      containers:
      - name: frontend-store
        image: ultron/frontend-store:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-store
spec:
  ports:
  - port: 3001
  selector:
    app: frontend-store
