version: '3.8'

services:
  # Ingress / Gateway Simulation
  ingress-proxy:
    image: nginx:alpine
    container_name: ultron-ingress
    ports:
      - "8080:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalog-service
      - inventory-service
      - order-service
      - payment-service

  # Microservice 1: Inventory (Real-Time Redis Sync for IMEI / Device Grade)
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: ultron-inventory
    environment:
      - PORT=4001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_NAME=ultrondb
      - DB_USER=appuser
      - DB_PASSWORD=devsecret
    expose:
      - "4001"
    depends_on:
      - redis
      - postgres

  # Microservice 2: Catalog (Phone Models, Diagnostics, Condition Grades)
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: ultron-catalog
    environment:
      - PORT=4002
      - DB_HOST=postgres
      - DB_NAME=ultrondb
      - DB_USER=appuser
      - DB_PASSWORD=devsecret
    expose:
      - "4002"
    depends_on:
      - postgres

  # Microservice 3: Order Service (Phone Reservation Locks & Cart State)
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: ultron-order
    environment:
      - PORT=4003
      - DB_HOST=postgres
      - DB_NAME=ultrondb
      - DB_USER=appuser
      - DB_PASSWORD=devsecret
      - INVENTORY_URL=http://inventory-service:4001
    expose:
      - "4003"
    depends_on:
      - postgres
      - inventory-service

  # Microservice 4: Payment Service (Gateway Webhooks & Idempotency)
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: ultron-payment
    environment:
      - PORT=4004
      - STRIPE_SECRET_KEY=sk_test_mock_dummy
      - WEBHOOK_SECRET=whsec_mock_dummy
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ultrondb
      - DB_USER=appuser
      - DB_PASSWORD=devsecret
    expose:
      - "4004"
    depends_on:
      - postgres

  frontend-store:
    build:
      context: ./services/frontend-store
      dockerfile: Dockerfile
    container_name: ultron-frontend
    ports:
      - "3001:80"

  # Supporting State Stores: Redis for Sub-millisecond Inventory Locks
  redis:
    image: redis:7-alpine
    container_name: ultron-redis
    ports:
      - "6379:6379"

  # Supporting State Stores: PostgreSQL (Simulating on-prem prior to Cloud SQL)
  postgres:
    image: postgres:15-alpine
    container_name: ultron-postgres
    environment:
      POSTGRES_DB: ultrondb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devsecret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/inventory-service/src/schema/02-inventory-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  pgdata:
