version: '3.8'

services:
  # API Gateway / Ingress Router
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: ultron-gateway
    ports:
      - "8080:80"
    depends_on:
      - inventory-service
      - catalog-service
      - order-service
      - payment-service
      - frontend-store
    networks:
      - ultron-network

  # Microservice 1: Inventory (Redis Redlock & Real-Time Stock)
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: ultron-inventory
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_NAME=ultrondb
      - DB_USER=appuser
      - DB_PASSWORD=devsecret
    depends_on:
      - redis
      - postgres
    depends_on:
      - redis
      - postgres
    networks:
      - ultron-network

  # Microservice 2: Catalog (Devices, Grades, 40-Point Diagnostics)
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: ultron-catalog
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - DB_HOST=postgres
      - DB_NAME=ultrondb
      - DB_USER=appuser
      - DB_PASSWORD=devsecret
    depends_on:
      - postgres
    networks:
      - ultron-network

  # Microservice 3: Order Service (Checkout, Stock Locks, Fulfillment)
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: ultron-order
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - DB_HOST=postgres
      - DB_NAME=ultrondb
      - DB_USER=appuser
      - DB_PASSWORD=devsecret
      - INVENTORY_URL=http://inventory-service:4001
    depends_on:
      - postgres
      - inventory-service
    networks:
      - ultron-network

  # Microservice 4: Payment Service (Instant EFT, Cards, Lightning, Idempotency)
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: ultron-payment
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - DB_HOST=postgres
      - DB_NAME=ultrondb
      - DB_USER=appuser
      - DB_PASSWORD=devsecret
      - STRIPE_SECRET_KEY=sk_test_mock_dummy
      - WEBHOOK_SECRET=whsec_mock_dummy
    depends_on:
      - postgres
    networks:
      - ultron-network

  # Customer Frontend Store (Vite React SPA)
  frontend-store:
    build:
      context: ./services/frontend-store
      dockerfile: Dockerfile
    container_name: ultron-frontend
    ports:
      - "3001:80"
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:8080
    networks:
      - ultron-network

  # Redis 7 (In-Memory Sub-millisecond Redlock & Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: ultron-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ultron-network

  # PostgreSQL 15 (Source Database with ULTRON Schemas)
  postgres:
    image: postgres:15-alpine
    container_name: ultron-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ultrondb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devsecret
    volumes:
      - postgres_data:/var/lib/postgresql/data
- ./services/catalog-service/src/schema/01-catalog-schema.sql:/docker-entrypoint-initdb.d/01-catalog.sql:ro
      - ./services/inventory-service/src/schema/02-inventory-schema.sql:/docker-entrypoint-initdb.d/02-inventory.sql:ro
      - ./services/order-service/src/schema/03-orders-schema.sql:/docker-entrypoint-initdb.d/03-orders.sql:ro
      - ./services/payment-service/src/schema/04-payments-schema.sql:/docker-entrypoint-initdb.d/04-payments.sql:ro
    networks:
      - ultron-network

volumes:
  redis_data:
  postgres_data:

networks:
  ultron-network:
    driver: bridge
