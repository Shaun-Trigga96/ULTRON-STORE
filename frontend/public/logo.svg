<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients matching the ULTRON STORE official branding -->
    <linearGradient id="ultron-loop-left" x1="0%" y1="80%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00D8F6" />
    </linearGradient>

    <linearGradient id="ultron-loop-top" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="65%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="ultron-basket" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="ultron-arrow-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00D8F6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ICON CONTAINER (X: 20 to 220, Y: 20 to 200) -->
  <g transform="translate(10, 5)" filter="url(#soft-glow)">
    <!-- 1. Left Loop of Infinity -->
    <path
      d="M 128,105
         C 128,75 106,52 76,52
         C 46,52 24,76 24,106
         C 24,136 47,158 77,158
         C 104,158 122,138 138,114"
      stroke="url(#ultron-loop-left)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 2. Crossing Ribbon Over To Right Cart Loop -->
    <path
      d="M 68,155
         C 95,152 118,128 136,104
         C 152,80 170,54 200,54
         C 214,54 226,63 232,76"
      stroke="url(#ultron-loop-top)"
      stroke-width="17"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3. Shopping Cart Basket & Right Lip / Handle -->
    <path
      d="M 230,74
         L 223,105
         C 218,128 198,144 174,144
         L 138,144
         C 126,144 116,134 118,122
         C 119,112 128,104 138,104
         L 142,104"
      stroke="url(#ultron-basket)"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Cart Upper Rim Extension -->
    <path
      d="M 222,76
         L 236,76"
      stroke="url(#ultron-basket)"
      stroke-width="14"
      stroke-linecap="round"
    />

    <!-- 4. Fast Forward Arrow inside Shopping Cart -->
    <g transform="translate(0, 0)">
      <!-- Arrow Tail / Shaft -->
      <path
        d="M 134,105 L 175,105"
        stroke="url(#ultron-arrow-grad)"
        stroke-width="13"
        stroke-linecap="round"
      />
      <!-- Arrow Point Head -->
      <path
        d="M 166,88 L 194,105 L 166,122 Z"
        fill="url(#ultron-arrow-grad)"
        stroke-linejoin="round"
      />
    </g>

    <!-- 5. Cart Wheels -->
    <circle cx="146" cy="168" r="8.5" fill="#6D28D9" />
    <circle cx="188" cy="168" r="8.5" fill="#7C3AED" />
  </g>

  <!-- TYPOGRAPHY CONTAINER (X: 270, Y: 100) -->
  <g transform="translate(265, 0)">
    <!-- ULTRON (Bold, Geometric Modern Tech Font) -->
    <text
      x="0"
      y="108"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif"
      font-size="78"
      font-weight="900"
      letter-spacing="2.5"
      fill="#0B0F19"
    >
      ULTRON
    </text>

    <!-- STORE (Sleek Geometric Wide Tracking) -->
    <text
      x="2"
      y="168"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif"
      font-size="52"
      font-weight="700"
      letter-spacing="7"
      fill="#374151"
    >
      STORE
    </text>
  </g>
</svg>
