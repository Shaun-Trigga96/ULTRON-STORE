events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile        on;
    keepalive_timeout 65;

    # Upstream Microservice Definitions
    upstream inventory_backend {
        server inventory-service:4001;
    }

    upstream catalog_backend {
        server catalog-service:4002;
    }

    upstream order_backend {
        server order-service:4003;
    }

    upstream payment_backend {
        server payment-service:4004;
    }

    upstream frontend_store {
        server frontend-store:3001;
    }

    server {
        listen 80;
        server_name localhost;

        # Gzip compression
        gzip on;
        gzip_types text/plain application/json application/javascript text/css;

        # Gateway Health
        location /health {
            return 200 '{"status":"UP","gateway":"ULTRON API Gateway Nginx","version":"1.0.0"}';
            add_header Content-Type application/json;
        }

        # 1. Inventory Service Routes
        location /api/v1/inventory/ {
            proxy_pass http://inventory_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Catalog Service Routes
        location /api/v1/catalog/ {
            proxy_pass http://catalog_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Order Service Routes
        location /api/v1/orders/ {
            proxy_pass http://order_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. Payment Service Routes
        location /api/v1/payments/ {
            proxy_pass http://payment_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Idempotency-Key $http_idempotency_key;
        }

        # 5. Frontend Store Application
        location / {
            proxy_pass http://frontend_store;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
